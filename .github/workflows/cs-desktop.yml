name: Cloud sandbox desktop test build (fork)

# Fork-only, never part of the upstream PR. Builds the Windows x64 desktop from the commit pinned in
# .github/cs-e2e/app-ref (cs/integration) as an unsigned SIDE-BY-SIDE test build for SOBECK, and publishes
# it with the relay kit as the fork prerelease cs-desktop-<app sha8>-k<harness sha8>.
#
# cs/integration has no side-by-side support (it stays in #864's fork scaffolding), so the build applies
# .github/cs-e2e/side-by-side.patch first: rc/integration's main/src/utils/sideBySide.ts and its wiring, and
# scripts/build-win.js passing electron-builder arguments through (-c.extraMetadata.*),
# unchanged. Without it the build would share ~/.pane with Red's installed Pane and update itself.
#
# Its own side-by-side name (cloudsandbox: ~/.pane_cloudsandbox) keeps it apart from the Run 4 build in
# ~/.pane_cloudtest, which SOBECK keeps using.
#
# The kit is rc/integration's install.ps1 / remove.ps1 (pinned at RC_KIT_SHA, already proven on SOBECK)
# plus this branch's scripts/cloud-sandbox-e2e/sobeck (the "Add cloud sandbox" proof) and playwright-core.
#
# A dispatch with app_from=<cs-desktop-* tag> is a kit-only release: the app zip of that release byte for byte,
# the kit from this commit, as cs-desktop-<app sha8>-k<this sha8>. Every release is then proven on windows-latest
# against a fake host (the same app as a headless daemon on loopback) with a Claude stand-in (fake-claude.mjs).
on:
  push:
    branches:
      - cs/cs-e2e
    paths:
      - .github/cs-e2e/app-ref
      - .github/cs-e2e/side-by-side.patch
      - .github/workflows/cs-desktop.yml
      - scripts/cloud-sandbox-e2e/**
  workflow_dispatch:
    inputs:
      app_from:
        description: Kit-only release reusing this cs-desktop-* release's app zip byte for byte (empty = build the app)
        type: string
        default: ''
      app_ref:
        description: Build this ref/sha instead of .github/cs-e2e/app-ref (a drop; empty = the file)
        type: string
        default: ''
      ps_token_selftest:
        description: Only test the relay's PowerShell 5.1 GitHub-token length/sha256 one-liner on a fake credentials file
        type: boolean
        default: false
      launcher_smoke_tag:
        description: Only smoke SOBECK's exact Run 8 command (kit\run-real-user.ps1) on this published cs-desktop-* release; builds and publishes nothing
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cs-desktop-${{ github.sha }}
  cancel-in-progress: false

env:
  SIDE_BY_SIDE_NAME: cloudsandbox
  # The released Pane the smoke runs beside.
  INSTALLED_RELEASE: v2.4.146
  # rc/integration's relay kit scripts (install.ps1, remove.ps1, the side-by-side smoke).
  RC_KIT_SHA: 23d533649d4b11cedb1b9904c0b39c690e6fee3f
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  CSC_DISABLE: 'true'

jobs:
  app-from:
    name: App of ${{ inputs.app_from }} (kit-only release)
    if: github.repository != 'greenfield-inc/Pane' && inputs.app_from && !inputs.launcher_smoke_tag
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
    - id: meta
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        APP_FROM: ${{ inputs.app_from }}
        KIT_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        sha=$(gh release view "$APP_FROM" --repo "$REPO" --json targetCommitish -q .targetCommitish)
        zip=$(gh release view "$APP_FROM" --repo "$REPO" --json assets -q '.assets[].name' | grep -E -- '-Windows-x64\.zip$')
        version=${zip#Pane-CloudSandbox-}; version=${version%-Windows-x64.zip}
        { echo "sha=$sha"; echo "version=$version"; echo "tag=cs-desktop-${sha:0:8}-k${KIT_SHA:0:8}"; } >> "$GITHUB_OUTPUT"
        echo "Kit-only release: app $zip of $APP_FROM ($sha), kit from $KIT_SHA" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows x64 (side-by-side)
    if: github.repository != 'greenfield-inc/Pane' && !inputs.app_from && !inputs.launcher_smoke_tag && !inputs.ps_token_selftest
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
    - uses: actions/checkout@v7
      with:
        path: harness

    - id: ref
      shell: bash
      env:
        APP_REF: ${{ inputs.app_ref }}
      run: echo "ref=${APP_REF:-$(tr -d '[:space:]' < harness/.github/cs-e2e/app-ref)}" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v7
      with:
        ref: ${{ steps.ref.outputs.ref }}
        path: app

    - uses: actions/checkout@v7
      with:
        ref: ${{ env.RC_KIT_SHA }}
        path: rckit
        sparse-checkout: scripts/cloud-dist

    - id: meta
      name: Version = <pkg>-cs.<commit UTC time>.g<sha8>, side-by-side patch
      shell: bash
      working-directory: app
      env:
        KIT_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        sha=$(git rev-parse HEAD)
        stamp=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)
        version="$(node -p 'require("./package.json").version')-cs.${stamp}.g${sha:0:8}"
        { echo "sha=$sha"; echo "version=$version"; echo "tag=cs-desktop-${sha:0:8}-k${KIT_SHA:0:8}"; } >> "$GITHUB_OUTPUT"
        # The harness checkout gives the .patch CRLF on Windows (text=auto); the sources are eol=lf.
        tr -d '\r' < ../harness/.github/cs-e2e/side-by-side.patch > ../side-by-side.patch
        git apply --verbose ../side-by-side.patch
        echo "Building $version from $sha + side-by-side patch, kit from $KIT_SHA" >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/setup-node@v6
      with:
        node-version: '22.18.0'

    - name: Install dependencies
      shell: bash
      working-directory: app
      run: corepack enable pnpm && pnpm install

    - name: Side-by-side unit tests
      shell: bash
      working-directory: app
      run: CI=1 pnpm --filter main exec vitest run src/utils/sideBySide.test.ts src/utils/appDirectory.test.ts

    - name: Build (unpacked, unsigned, side-by-side)
      shell: bash
      working-directory: app
      run: >-
        node scripts/build-win.js x64 --
        -c.win.target=dir
        -c.appId=com.dcouple.pane.${{ env.SIDE_BY_SIDE_NAME }}
        -c.extraMetadata.version=${{ steps.meta.outputs.version }}
        -c.extraMetadata.paneSideBySide=${{ env.SIDE_BY_SIDE_NAME }}

    - name: Package zip
      shell: pwsh
      working-directory: app
      run: |
        $name = "Pane-CloudSandbox-${{ steps.meta.outputs.version }}-Windows-x64"
        New-Item -ItemType Directory -Force -Path ..\release | Out-Null
        Move-Item dist-electron\win-unpacked "dist-electron\$name"
        Push-Location dist-electron
        7z a -tzip -mx=7 "..\..\release\$name.zip" $name | Select-Object -Last 3
        Pop-Location
        Move-Item "dist-electron\$name" dist-electron\win-unpacked

    - name: Side-by-side smoke beside the released Pane
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download $env:INSTALLED_RELEASE --repo greenfield-inc/Pane --pattern "Pane-*-Windows-x64.exe" --dir installed
        $setup = (Get-ChildItem installed\*.exe | Select-Object -First 1).FullName
        rckit\scripts\cloud-dist\desktop-side-by-side-smoke.ps1 -TestExe "$PWD\app\dist-electron\win-unpacked\Pane.exe" `
          -ExpectedVersion "${{ steps.meta.outputs.version }}" -InstalledSetup $setup `
          -SideBySideName $env:SIDE_BY_SIDE_NAME -OutDir smoke-windows

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: smoke-windows
        path: smoke-windows
        if-no-files-found: warn

    - uses: actions/upload-artifact@v7
      with:
        name: desktop-windows
        path: release/*.zip
        if-no-files-found: error
        retention-days: 14

  release:
    name: Publish fork prerelease cs-desktop-<sha8>
    needs: [app-from, windows]
    if: >-
      always() && github.repository != 'greenfield-inc/Pane' &&
      (needs.windows.result == 'success' || needs.app-from.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.windows.outputs.tag || needs.app-from.outputs.tag }}
    env:
      APP_SHA: ${{ needs.windows.outputs.sha || needs.app-from.outputs.sha }}
      VERSION: ${{ needs.windows.outputs.version || needs.app-from.outputs.version }}
      TAG: ${{ needs.windows.outputs.tag || needs.app-from.outputs.tag }}
    steps:
    - uses: actions/checkout@v7

    - uses: actions/checkout@v7
      with:
        ref: ${{ env.RC_KIT_SHA }}
        path: rckit
        sparse-checkout: scripts/cloud-dist

    - uses: actions/download-artifact@v7
      if: ${{ !inputs.app_from }}
      with:
        name: desktop-windows
        path: release

    - name: The app zip of ${{ inputs.app_from }}, byte for byte
      if: ${{ inputs.app_from }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh release download "${{ inputs.app_from }}" --repo "$GITHUB_REPOSITORY" --dir release --pattern '*-Windows-x64.zip' --pattern SHA256SUMS.txt
        (cd release && grep -E -- '-Windows-x64\.zip$' SHA256SUMS.txt | sha256sum -c - && rm SHA256SUMS.txt)

    - name: Build the relay kit
      run: |
        set -euo pipefail
        playwright=$(grep -m1 -oE "^  '@playwright/test@[0-9.]+'" pnpm-lock.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
        kit=kit/relay-kit
        mkdir -p "$kit"
        cp rckit/scripts/cloud-dist/sobeck/{install.ps1,remove.ps1} "$kit/"
        cp scripts/cloud-sandbox-e2e/sobeck/* scripts/cloud-sandbox-e2e/{e2e.mjs,real-user.mjs,secrets.mjs,oracles.mjs,fake-claude.mjs} "$kit/"
        (cd "$kit" && echo '{"private":true}' > package.json && npm install --no-audit --no-fund --no-package-lock "playwright-core@$playwright")
        # Playwright's own Windows ffmpeg (revision 1011, pinned by hash): the real-user kit records its video with it and
        # cuts device-code intervals out of the recording. playwright-core alone has no ffmpeg, so there'd be no video.
        curl -sfLo ffmpeg-win64.zip https://cdn.playwright.dev/dbazure/download/playwright/builds/ffmpeg/1011/ffmpeg-win64.zip
        echo "8d08827c019ad36e7b9d49d3648447d884534cb2acf200e71c715f6dd834cc50  ffmpeg-win64.zip" | sha256sum -c -
        mkdir -p "$kit/ms-playwright/ffmpeg-1011" && unzip -q ffmpeg-win64.zip -d "$kit/ms-playwright/ffmpeg-1011" && rm ffmpeg-win64.zip
        (cd kit && zip -qr "../release/Pane-CloudSandbox-relay-kit-$VERSION.zip" relay-kit)
        cp rckit/scripts/cloud-dist/sobeck/install.ps1 release/sobeck-install.ps1

    - name: Publish prerelease
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ env.APP_SHA }}
      run: |
        set -euo pipefail
        case "$REPO" in greenfield-inc/*) echo "refusing to publish to $REPO" >&2; exit 1 ;; esac
        cd release
        sha256sum -- * > SHA256SUMS.txt
        cat SHA256SUMS.txt
        NOTES="Unsigned SIDE-BY-SIDE Windows desktop test build of ${SHA} (cs/integration, the \"Add cloud sandbox\" landing) plus rc/integration's side-by-side support, built by run ${GITHUB_RUN_ID}. Not an upstream release; it never updates itself.
        Version: ${VERSION}.${{ inputs.app_from && format(' App zip copied byte for byte from {0} (kit-only release).', inputs.app_from) || '' }} Relay kit: install.ps1/remove.ps1 from ${RC_KIT_SHA}, cloud sandbox proof from ${GITHUB_SHA}.
        It keeps its data in ~/.pane_${SIDE_BY_SIDE_NAME} and runs next to an installed Pane without touching it."
        # Releases are immutable: the relay checks every file against hashes published in the doc.
        if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
          echo "$TAG already published; keeping it unchanged" >> "$GITHUB_STEP_SUMMARY"
        else
          gh release create "$TAG" --repo "$REPO" --prerelease --target "$SHA" \
            --title "Pane cloud sandbox desktop test build ${TAG#cs-desktop-}" --notes "$NOTES" -- *
        fi
        echo "https://github.com/${REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

  # The published release, the way the relay runs it, with the cloud replaced: the same app as a headless daemon
  # on loopback stands in for the sandbox, and fake-claude.mjs for Claude Code (a runner has no tailnet, boat or
  # Claude credentials). windows-latest renders the terminal with WebGL like SOBECK, which broke the Run 5 driver.
  proof:
    name: Relay driver proof (Windows, fake host)
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '22.18.0'

    - name: Download and verify the release
      shell: bash
      run: |
        set -euo pipefail
        gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir rel --pattern '*-Windows-x64.zip' --pattern '*relay-kit*.zip' --pattern SHA256SUMS.txt
        (cd rel && grep -E -- '\.zip$' SHA256SUMS.txt | sha256sum -c -)
        mkdir -p app kit
        unzip -q rel/*-Windows-x64.zip -d app
        unzip -q rel/*relay-kit*.zip -d kit
        echo "PANE_BIN=$(cygpath -w "$(ls -d "$PWD"/app/*/Pane.exe)")" >> "$GITHUB_ENV"

    - name: Driver in fake mode (same app as fake host, Claude stand-in)
      shell: bash
      env:
        MODE: fake
        FAKE_CLAUDE: '1'
        SIDE_BY_SIDE_NAME: cloudsandbox
        PHASES: add,agent,stop,start,model-follow,remove,hygiene
      run: |
        export WORK="$(cygpath -w "$PWD/work")" OUT="$(cygpath -w "$PWD/work/evidence")"
        node kit/relay-kit/e2e.mjs || true
        test -f work/evidence/results.json

    # The previous landing's proof (e2e.mjs) is kept for comparison; the real-user kit below is what gates.
    - name: Every check passes except the known sidebar one
      continue-on-error: true
      shell: bash
      run: |
        node -e '
          const r = require("./work/evidence/results.json");
          const known = new Set(["same-panes-in-sidebar"]);
          const failed = r.checks.filter((c) => c.verdict === "FAIL" && !known.has(c.name));
          for (const c of r.checks) console.log(c.verdict, c.name, c.detail.slice(0, 160));
          if (failed.length) { console.error("FAILED:", failed.map((c) => c.name).join(", ")); process.exit(1); }
        '
        if grep -q "WebGL renderer failed" work/evidence/app-console.log; then
          echo "terminal renderer: DOM (WebGL unavailable on this runner)" | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo "terminal renderer: WebGL (as on SOBECK)" | tee -a "$GITHUB_STEP_SUMMARY"
        fi

    # Proof (3) of the real-user kit: it attaches to the released app on a Windows runner (WebGL terminal like SOBECK)
    # and drives D1 (host terminal), D3 (clone sign-in error -> prefilled terminal) and D4 (clone, remote picker,
    # Open via the picker, New) on a self-hosted host = the same app as a headless daemon on loopback, with a video.
    - name: Real-user kit on the fake host (D1, D3, D4, D9)
      if: always()
      shell: bash
      env:
        MODE: fake
        FAKE_CLAUDE: '1'
        SIDE_BY_SIDE_NAME: cloudsandbox
        STEPS: D1,D3,D4
        # The Windows runner as a self-hosted host shows no device code in the in-app sign-in (a generic E3 v2 finding,
        # reported); Run 8 signs in with E6's token instead, so this proof stops D3 at the terminal fallback.
        D3V2: '0'
      run: |
        export WORK="$(cygpath -w "$PWD/work-real")" OUT="$(cygpath -w "$PWD/work-real/evidence")"
        node kit/relay-kit/real-user.mjs || true
        test -f work-real/evidence/results.json
        node -e '
          const r = require("./work-real/evidence/results.json");
          for (const s of r.steps) console.log(s.id, s.verdict, s.error ?? "", (s.checks ?? []).filter((c) => c.verdict === "FAIL").map((c) => c.name).join(","));
          console.log("video:", JSON.stringify(r.video), "cuts:", JSON.stringify(r.videoCuts ?? []));
          console.log("secret scan:", JSON.stringify(r.secretScan));
        ' | tee -a "$GITHUB_STEP_SUMMARY"
        node -e '
          const r = require("./work-real/evidence/results.json");
          const bad = r.steps.filter((s) => s.verdict !== "PASS").map((s) => s.id);
          const leaks = (r.secretScan?.knownValueHits?.length ?? 1) + (r.secretScan?.tokenShapeHits?.length ?? 1);
          if (bad.length || leaks || !r.video.length) { console.error("real-user kit proof FAILED:", bad.join(","), "leaks", leaks, "video", r.video.length); process.exit(1); }
        '

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: real-user-kit-proof
        path: work-real/evidence
        if-no-files-found: warn

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: relay-driver-proof
        path: work/evidence
        if-no-files-found: warn

  # SOBECK's exact Run 8 command (kit\run-real-user.ps1: Pane.exe as Node, live console through Tee-Object, evidence zip)
  # on a published release. No cloud credentials exist here, so relay mode stops at D0's wallet check before any Add.
  launcher-smoke:
    name: Run 8 launcher smoke (Windows)
    if: github.repository != 'greenfield-inc/Pane' && inputs.launcher_smoke_tag
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.launcher_smoke_tag }}
    steps:
    - name: Lay out the release like sobeck-install.ps1 does (app\, kit\)
      shell: bash
      run: |
        set -euo pipefail
        gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir rel --pattern '*.zip' --pattern SHA256SUMS.txt
        (cd rel && grep -E -- '\.zip$' SHA256SUMS.txt | sha256sum -c -)
        root="$USERPROFILE/PaneCloudSandbox"
        mkdir -p "$root/app" "$root/kit" unz
        unzip -q rel/*-Windows-x64.zip -d unz/app && cp -r unz/app/*/. "$root/app/"
        unzip -q rel/*relay-kit*.zip -d unz/kit && cp -r unz/kit/relay-kit/. "$root/kit/"
        ls "$root/app/Pane.exe" "$root/kit/real-user.mjs" "$root/kit/ms-playwright/ffmpeg-1011/ffmpeg-win64.exe"

    - name: The Run 8 command, as on SOBECK
      shell: powershell
      run: |
        $out = "$env:USERPROFILE\PaneCloudSandbox\evidence\smoke"
        powershell -NoProfile -ExecutionPolicy Bypass -File "$env:USERPROFILE\PaneCloudSandbox\kit\run-real-user.ps1" `
          -DebUrl 'https://example.invalid/none.deb' -DebSha256 ('0' * 64) -OutDir $out -CloseRunning
        "exit code: $LASTEXITCODE"
        if (-not (Test-Path "$out.zip")) { throw 'no evidence zip' }
        $console = Get-Content "$out\proof.console.txt" -Raw
        if ($console -notmatch 'mode relay') { throw 'the kit did not start in relay mode' }
        if ($console -notmatch 'wallet') { throw 'the run did not reach the wallet check' }
        if ($console -match 'boat start') { throw 'a start was counted: must never happen here' }
        if (-not (Test-Path "$out\results.json")) { throw 'no results.json' }
        # Run 8 must run every step and sub-check by DEFAULT (STEPS empty): Run 8 f2c32d2a silently lacked DW7.
        $plan = ($console -split "`n" | Where-Object { $_ -match 'plan: steps=' } | Select-Object -First 1)
        if (-not $plan) { throw 'no plan line' }
        $steps = ([regex]::Match($plan, 'steps=(\S+)')).Groups[1].Value
        if ($steps -ne 'D0,D1,D3,D2,D4,D5,DW7,D6,D7,D8,D9') { throw "default steps are '$steps', not D0,D1,D3,D2,D4,D5,DW7,D6,D7,D8,D9" }
        foreach ($flag in 'd7-refresh=on', 'd7-doppler-noop=on', 'd7-failing-chip=on', 'dw7-doppler=on', 'd6-agent-env=on') {
          if ($plan -notmatch [regex]::Escape($flag)) { throw "plan lacks $flag" }
        }
        foreach ($end in 'end: restore-local-start-script', 'end: restore-startup-script') {
          if ($console -notmatch [regex]::Escape($end)) { throw "the run never reached '$end'" }
        }
        "default plan OK: $steps; D7 refresh/no-op/failing chip, DW7 Doppler, D6 agent env all on; both restores reached"
        # The FATAL path must still have restored: the restores sit in main's finally, before the rejection handler.
        $endAt = ($console -split "`n" | Select-String -Pattern 'end: restore-startup-script' | Select-Object -First 1).LineNumber
        $fatalAt = ($console -split "`n" | Select-String -Pattern 'FATAL' | Select-Object -First 1).LineNumber
        if ($fatalAt -and $endAt -and $endAt -gt $fatalAt) { throw 'the restores ran AFTER the FATAL line' }
        "launcher smoke PASS: live console, relay mode, stopped at the wallet check (expected: no credentials here), restores reached before FATAL, results.json + zip written"
        # The kit's own exit code (2: it stopped at the wallet check, as designed here) is not this job's result.
        exit 0

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: launcher-smoke
        path: ~/PaneCloudSandbox/evidence
        if-no-files-found: warn

  # The relay's one-liner that reports Red's SAVED GitHub token as length + sha256 only (AUDIT RUN8), run exactly as posted
  # in Windows PowerShell 5.1 against a fake credentials file: the output must be exactly "len=<n> sha256=<hex>" and
  # must never contain the (fake) value.
  ps-token-selftest:
    name: PowerShell 5.1 token len/sha256 one-liner
    if: github.repository != 'greenfield-inc/Pane' && inputs.ps_token_selftest
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
    - name: Fake credentials and the exact one-liner
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        $dir = "$env:USERPROFILE\.config\runpane-cloud"
        New-Item -ItemType Directory -Force $dir | Out-Null
        $fake = 'github_' + 'pat_' + 'FAKE' + ('x' * 70)
        Set-Content -LiteralPath "$dir\credentials.json" -Value ('{"boat":{"apiKey":"k"},"github":{"token":"' + $fake + '"}}') -Encoding ASCII
        $want = "len=$($fake.Length) sha256=$(([BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($fake)))).Replace('-','').ToLower())"
        $out = powershell -NoProfile -Command {
          $c = Get-Content -Raw "$env:USERPROFILE\.config\runpane-cloud\credentials.json" | ConvertFrom-Json; $t = [string]$c.github.token; $b = [Text.Encoding]::UTF8.GetBytes($t); "len=$($t.Length) sha256=$(([BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($b))).Replace('-','').ToLower())"
        } | Out-String
        $out = $out.Trim()
        if ($out -match [regex]::Escape($fake)) { throw 'the one-liner printed the value' }
        if ($out -notmatch '^len=\d+ sha256=[0-9a-f]{64}$') { throw "unexpected output shape: $out" }
        if ($out -ne $want) { throw "len/sha256 differ from the expected ones" }
        Remove-Item -LiteralPath "$dir\credentials.json" -Force
        "PASS: output is exactly '$out' (the fake token's length and sha256; the value never printed)"
        # The no-token case: len=0.
        Set-Content -LiteralPath "$dir\credentials.json" -Value '{"boat":{"apiKey":"k"}}' -Encoding ASCII
        $none = (powershell -NoProfile -Command { $c = Get-Content -Raw "$env:USERPROFILE\.config\runpane-cloud\credentials.json" | ConvertFrom-Json; $t = [string]$c.github.token; $b = [Text.Encoding]::UTF8.GetBytes($t); "len=$($t.Length) sha256=$(([BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($b))).Replace('-','').ToLower())" } | Out-String).Trim()
        if (-not $none.StartsWith('len=0 ')) { throw "no-token case: $none" }
        "PASS: no saved token -> '$none'"
